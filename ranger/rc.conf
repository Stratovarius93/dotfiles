# Ranger config (Gruvbox + vista previa en terminal + salida rápida)

set preview_files true
set preview_directories true
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh
set preview_images false
set draw_borders both
set confirm_on_delete multiple
set vcs_aware true

# Esc: cerrar ranger inmediatamente sin cambiar la carpeta de la terminal
map <ESC> quit

# q / Q: cerrar ranger y cambiar la terminal (cd) a la carpeta actual
map q quit_cd
map Q quit_cd
